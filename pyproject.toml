[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "status-pulse"
version = "0.1.0"
description = "Status Pulse"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "httpx",
    "uvicorn",
]

[project.scripts]
status-pulse = "status_pulse.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
